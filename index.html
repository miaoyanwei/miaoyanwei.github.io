<!-- lightbox for images -->
<div id="lightbox" class="lightbox" hidden>
  <button type="button" id="lightboxClose" class="lightbox-close" aria-label="Close">
    <i data-lucide="x"></i>
  </button>
  <img id="lightboxImg" src="" alt="">
</div>

<body>

<header class="top">
  <div class="brand">
    <span class="brand-name">miao.ai</span><span class="brand-version">1.0</span>
  </div>
</header>

<div class="app">

  <div class="chat-scroll" id="chatScroll">
    <div id="smiley"></div>
  </div>

  <div class="composer" id="composer">
    <input id="composerInput" type="text" autocomplete="off" placeholder="What are you curious about?" />
    <button type="button" id="sendBtn" aria-label="Send">
      <i data-lucide="send-horizontal"></i>
    </button>
  </div>

</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>

<!-- data + logic, loaded last so all DOM elements above already exist -->
<script src="app.js"></script>
</body>
