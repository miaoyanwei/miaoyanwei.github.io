<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miao's Artificial Stupidity</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<!-- fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">

<!-- styles -->
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="top">
  <div class="brand">
    <span class="brand-name">miao.ai</span><span class="brand-version">1.0</span>
  </div>
</header>

<div class="app">

  <div class="chat-scroll" id="chatScroll">
    <div id="smiley"></div>
  </div>

  <div class="composer" id="composer">
    <input id="composerInput" type="text" autocomplete="off" placeholder="Ask me anything" />
    <button type="button" id="sendBtn" aria-label="Send">
      <i data-lucide="send-horizontal"></i>
    </button>
  </div>

</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>

<!-- data + logic, loaded last so all DOM elements above already exist -->
<script src="app.js"></script>
</body>
</html>
